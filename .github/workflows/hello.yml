name: Primeira Action

on:
  # Permite iniciar o workflow manualmente pela aba Actions.
  workflow_dispatch:

  # Executa quando commits são enviados para a branch main.
  push:
    branches:
      - main

  # Outros gatilhos comuns (descomente para testar):

  # Executa quando um pull request direcionado à main é aberto ou atualizado.
  # pull_request:
  #   branches:
  #     - main

  # Executa em um horário agendado usando cron em UTC.
  # schedule:
  #   - cron: "0 12 * * 1-5"

  # Executa quando uma issue é aberta.
  # issues:
  #   types:
  #     - opened

  # Executa quando uma release é publicada.
  # release:
  #   types:
  #     - published

  # Permite que outro sistema inicie o workflow pela API do GitHub.
  # repository_dispatch:
  #   types:
  #     - executar-poc

jobs:
  hello:
    name: Executar exemplo
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Exibir mensagem
        run: echo "Olá, GitHub Actions!"

      - name: Mostrar informações da execução
        run: |
          echo "Repositório: $GITHUB_REPOSITORY"
          echo "Branch ou tag: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Evento: $GITHUB_EVENT_NAME"
